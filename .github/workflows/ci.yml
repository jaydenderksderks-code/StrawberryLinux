name: Strawberry CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x build.sh rootfs/usr/local/bin/{rm,berryinstall,str-} tests/test-rm.py
      - name: Bash syntax
        run: |
          bash -n build.sh
          bash -n rootfs/usr/local/bin/rm
          bash -n rootfs/usr/local/bin/berryinstall
          bash -n rootfs/usr/local/bin/str-
          bash -n rootfs/etc/profile
          bash -n rootfs/etc/profile.d/strawberry.bash
          bash -n iso/profile/profiledef.sh
      - name: rm regression tests
        run: python3 tests/test-rm.py
