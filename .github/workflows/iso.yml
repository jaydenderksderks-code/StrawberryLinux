
name: Build Strawberry ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'kernel/**'
      - 'iso/**'
      - '.github/workflows/iso.yml'
      - 'locks/**'
      - 'rootfs/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Strawberry Linux
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libelf-dev dwarves xz-utils gnupg curl \
            cpio gzip busybox-static grub-pc-bin \
            grub-efi-amd64-bin grub-common \
            xorriso mtools dosfstools qemu-system-x86 ovmf

      - name: Build Linux kernel
        run: |
          chmod +x build.sh kernel/configure.sh
          ./build.sh x86_64 tty

      - name: Build bootable ISO
        run: |
          chmod +x iso/build-iso.sh iso/init
          ./iso/build-iso.sh x86_64

      - name: Smoke-test BIOS and UEFI boot in QEMU
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find dist -maxdepth 1 -name '*.iso' -print -quit)"
          test -n "$iso"

          run_boot_test() {
            local mode="$1"
            shift
            local log="dist/qemu-${mode}.log"
            set +e
            timeout 45s qemu-system-x86_64 -m 512 -cdrom "$iso" -boot d \
              -display none -serial "file:$log" -monitor none -no-reboot "$@"
            local status=$?
            set -e
            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              cat "$log"
              echo "QEMU ${mode} boot failed with status $status" >&2
              return 1
            fi
            if ! grep -Fq "Strawberry Linux live TTY" "$log"; then
              cat "$log"
              echo "Strawberry live userspace did not start in ${mode} mode" >&2
              return 1
            fi
            echo "QEMU ${mode} boot reached Strawberry live TTY"
          }

          run_boot_test bios

          code="$(find /usr/share/OVMF -maxdepth 1 -name 'OVMF_CODE*.fd' -print -quit)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -name 'OVMF_VARS*.fd' -print -quit)"
          test -n "$code" && test -n "$vars"
          cp "$vars" dist/OVMF_VARS.fd
          run_boot_test uefi \
            -drive "if=pflash,format=raw,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,file=dist/OVMF_VARS.fd"

      - name: Upload Strawberry Linux ISO
        uses: actions/upload-artifact@v4
        with:
          name: strawberry-linux-x86_64-tty
          path: |
            dist/*.iso
            dist/SHA256SUMS
          if-no-files-found: error
