name: Build Strawberry ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'iso/**'
      - 'rootfs/**'
      - '.github/workflows/iso.yml'
jobs:
  build:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso tools
        run: pacman -Sy --noconfirm archlinux-keyring && pacman -Syu --noconfirm archiso squashfs-tools arch-install-scripts git
      - name: Build ISO
        run: bash build.sh x86_64
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: strawberry-linux-arch-x86_64
          path: dist/*.iso
          if-no-files-found: error
